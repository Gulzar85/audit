ckground-size: 200% 100%; animation: shimmer 3s ease-in-out infinite; height: 1px; }  .decoration-blob-1 { background: linear-gradient(to bottom right, color-mix(in srgb, var(--primary) 5%, transparent), color-mix(in srgb, var(--secondary) 5%, transparent)); }  .decoration-blob-2 { background: linear-gradient(to top right, color-mix(in srgb, var(--secondary) 5%, transparent), color-mix(in srgb, var(--primary) 5%, transparent)); }  .dark .text-gray-500  { color: #9ca3af !important; }  </style>  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
