<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:'Inter',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr><td align="center" style="padding:40px 16px;">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.06);">
        <tr>
          <td style="background:linear-gradient(135deg,#6b7280 0%,#4b5563 100%);border-radius:16px 16px 0 0;padding:32px 40px;text-align:center;">
            <h1 style="margin:0;font-size:22px;font-weight:800;color:#ffffff;">Corrective Action Closed</h1>
            <p style="margin:8px 0 0;font-size:14px;color:rgba(255,255,255,0.8);">{{ restaurant_name }}</p>
          </td>
        </tr>
        <tr>
          <td style="padding:32px 40px;">
            <p style="margin:0 0 16px;font-size:14px;color:#374151;line-height:1.6;">
              The following corrective action has been closed. No further action is required.
            </p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f9fafb;border-radius:12px;padding:20px;">
              <tr>
                <td style="font-size:14px;color:#374151;line-height:1.6;">
                  {{ description }}
                </td>
              </tr>
            </table>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:16px;">
              <tr>
                <td style="padding:6px 0;font-size:14px;color:#6b7280;">Closed By</td>
                <td style="padding:6px 0;font-size:14px;font-weight:600;color:#111827;text-align:right;">{{ closed_by }}</td>
              </tr>
              <tr>
                <td style="padding:6px 0;font-size:14px;color:#6b7280;">Risk Level</td>
                <td style="padding:6px 0;font-size:14px;font-weight:600;color:#111827;text-align:right;">{{ risk_level }}</td>
              </tr>
            </table>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td align="center" style="padding:24px 0 0;">
                  <a href="{{ ca_url }}" style="display:inline-block;padding:14px 32px;background:linear-gradient(135deg,#6b7280 0%,#4b5563 100%);color:#ffffff;font-size:14px;font-weight:700;text-decoration:none;border-radius:12px;">View Details</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 40px;text-align:center;font-size:12px;color:#9ca3af;border-top:1px solid #e5e7eb;">
            &copy; {% now "Y" %} McDonald's Pakistan &mdash; Audit Management System
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
